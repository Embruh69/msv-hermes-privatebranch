# site settings
title: MSV Hermes

# GitHub Pages PROJECT site: the repo name goes in baseurl, NOT in url.
#   url     = scheme + host only (used by absolute_url: og:image, og:url, etc.)
#   baseurl = subpath the site is served from (used by relative_url: CSS, JS, images, links)
url: "https://embruh69.github.io"
baseurl: "/msv-hermes-privatebranch"

# For the real deployment on the custom domain, use instead:
# url: "https://msv-hermes.net"
# baseurl: ""

description: "Earth has given you everything it's going to. Proxima hasn't even started. Board the Hermes for a one-way voyage to a world worth waking up for."
image: /assets/images/hero-bg.png

# homepage tiles
tiles-source: pages # accepts "posts" or "pages"
tiles-count: 6

# build settings
markdown: kramdown

sass:
  style: compressed

exclude:
- "*.gemspec"
- LICENSE.md
- CONTRIBUTING.md
- README.md
